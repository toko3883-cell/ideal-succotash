<style>
*{box-sizing:border-box;}
body{
    font-family:-apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    padding:16px;
    background:#f7f7f7;
    font-size:16px;
    line-height:1.5;
    max-width:1024px;
    margin:0 auto;
}
h1,h2,h3,h4{
    text-align:center;
    margin:8px 0;
    font-weight:bold;
}
.title-main{
    text-align:center;
}
.section{
    background:#ffffff;
    padding:16px;
    margin-bottom:12px;
    border:1px solid #aaa;
}
.row{
    margin:8px 0;
}
label{
    display:block;
    margin-bottom:2px;
}
input[type="text"]{
    width:100%;
    font-size:16px;
    padding:7px;
    border:1px solid #999;
    border-radius:4px;
    background:#efefef;
    cursor:not-allowed;
}
.check-item{
    display:flex;
    gap:6px;
    align-items:flex-start;
    margin:6px 0;
}
.btn-bar{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;
    margin-bottom:16px;
}
button{
    padding:9px;
    font-size:15px;
    border:none;
    border-radius:6px;
    color:#fff;
}
.btn-teal{background:#20c997;color:#000;}
.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.three-col{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}
.print-area{display:none;}
@page{
    size:A4 portrait;
    margin:0;
}
@media print{
    *{
        box-sizing:border-box;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }
    html,body{
        margin:0 !important;
        padding:0 !important;
        min-height:auto !important;
        height:auto !important;
    }
    body{
        background:#fff;
        font-size:11.2pt;
        line-height:1.50;
        margin:0;
    }
    body > :not(.print-area){display:none !important;}
    .print-area{display:block !important;}
    .page{
        width:210mm;
        height:auto;
        padding:4mm 12mm 6mm 20mm;
        margin:0;
    }
    .forceNextPage{
        page-break-before: always;
        break-before: page;
    }
    .two-col-p{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:4mm;
    }
    .inline-row{
        display:flex;
        align-items:flex-end;
        gap:2mm;
        margin:1.2mm 0;
    }
    .inline-row label{
        white-space:nowrap;
    }
    .inline-row .line{
        flex:1;
        border-bottom:1px solid #000;
        min-height:13px;
        padding:0 2px;
        max-width:70mm;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    table{
        width:100%;
        border-collapse:collapse;
        margin:2px 0 4px 0;
    }
    td{
        border:1px solid #000;
        padding:2.5px;
    }
    h4{text-align:left;margin:1.2mm 0 0.5mm 0;font-size:10pt;}
    h3{margin:1.6mm 0 0.7mm 0;font-size:11.3pt;}
    .title-print{
        text-align:center;
        font-weight:bold;
        margin:0.5mm 0 2.0mm 0;
        padding:0 !important;
        font-size:18pt;
    }
    p{margin:0.9mm 0;}

<p>3.單循環賽制，12支隊伍平均分成4組進行比賽，每組首名晉級至盃賽、次名晉級碟賽、第三名晉級至碗賽。</p>
<p>4.盃碟碗賽以後的賽事則採取4強淘汰賽制。</p>
<p>5.單循環賽採15分直接得分制，一局定勝負；淘汰賽採15分得分制(若14:14，先領先2分者勝；若20:20，先得21分者勝)。先達8分，雙方需交換場區。</p>
<p>6.全日賽事，大會安排球證及司線員。</p>
<p>7 大會不設上訴，一切以當場裁判決定為準。</p>
<p><strong>隊際賽事勝負計算:</strong></p>
<p>1. 比賽方式均是每隊派五對雙打上場，共賽五局</p>
<p>2. 五局比賽中，贏得四局數的一隊為得勝隊，或若局數比數三比二時，不論何隊取三局，均須以五局總分數定勝負，總分高者即使只勝兩局，亦作勝論。凡棄權作每局負十五比零計，得勝隊可獲分兩分，負方一分，棄權者零分（即其對賽隊伍可獲兩分）。</p>
<p>3. 所有比賽必須將五局賽事完成。</p>
<p><strong>12強小組賽計分方法：</strong></p>
<p>a. 小組賽勝方兩分，負方一分，棄權零分。</p>
<p>b. 倘若三隊所得分數相同，而不能以勝者為勝方法計算，則計算相關球隊相互比賽勝場局數，多者名次列前。如勝場局數相同，則計算相同隊伍的對賽成績，勝者為勝。</p>
<p>c. 倘若再相同，則計算相關隊伍每局分數之勝負差，多者名次列前。</p>
<p>d.(計算公式: 勝負差 = 得局/分 − 失局/分)</p>
<p>e.如結果仍然相同，則由賽會抽籤決定勝方。</p>
